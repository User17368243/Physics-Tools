<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Final Velocity (v)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: transparent;
            margin: 0;
            padding: 10px;
        }
        .physics-calc-box { 
            max-width: 360px; 
            margin: 0 auto; 
            padding: 20px; 
            background: #fdfdfd; 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            box-sizing: border-box; 
        }
        .physics-calc-box h3 { margin: 0 0 5px 0; color: #1e293b; }
        .calc-formula { margin: 0 0 15px 0; font-size: 13px; color: #64748b; font-style: italic; }
        .calc-field { margin-bottom: 12px; }
        .calc-field label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 500; color: #475569; }
        .calc-field input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .calc-field input:focus { outline: 2px solid #2563eb; border-color: transparent; }
        .calc-button { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 5px; transition: background 0.2s; }
        .calc-button:hover { background: #1d4ed8; }
        .calc-output { margin-top: 15px; padding: 12px; background: #f0fdf4; border-left: 4px solid #16a34a; border-radius: 4px; color: #166534; font-weight: 600; font-size: 16px; }

        /* Widget-Specific History Panel */
        .history-section { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 14px; }
        .history-title { font-size: 13px; font-weight: 700; color: #334155; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .clear-btn { background: none; border: none; color: #ef4444; font-size: 11px; cursor: pointer; font-weight: 600; padding: 0; }
        .history-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item { background: #f8fafc; border: 1px solid #f1f5f9; padding: 8px 10px; border-radius: 6px; font-size: 12px; color: #334155; cursor: pointer; }
        .history-item:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .history-calc { font-weight: 600; color: #1e293b; }
        .history-meta { color: #64748b; font-size: 11px; margin-top: 2px; }
    </style>
</head>
<body>

<div class="physics-calc-box">
    <h3>Calculate Final Velocity (v)</h3>
    <p class="calc-formula">Formula: v = u + at</p>
    
    <div class="calc-field">
        <label for="v_u">Initial Velocity (u) in m/s:</label>
        <input type="number" id="v_u" value="0" step="any">
    </div>
    <div class="calc-field">
        <label for="v_a">Acceleration (a) in m/s²:</label>
        <input type="number" id="v_a" placeholder="e.g. 9.8" step="any">
    </div>
    <div class="calc-field">
        <label for="v_t">Time (t) in seconds:</label>
        <input type="number" id="v_t" placeholder="e.g. 5" step="any" min="0">
    </div>
    
    <button onclick="calcVelocity()" class="calc-button">Calculate Velocity</button>
    
    <div id="v_res" class="calc-output" style="display: none;"></div>

    <div class="history-section">
        <div class="history-title">
            <span>Recent Calculations</span>
            <button onclick="clearHistory()" class="clear-btn">Clear</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<script>
// Isolated storage key specifically for Velocity
const STORAGE_KEY = 'physics_velocity_calculator_history';

document.addEventListener('DOMContentLoaded', loadHistory);

function calcVelocity() {
    const uInput = document.getElementById('v_u').value;
    const aInput = document.getElementById('v_a').value;
    const tInput = document.getElementById('v_t').value;

    const u = parseFloat(uInput) || 0;
    const a = parseFloat(aInput);
    const t = parseFloat(tInput);
    
    if (isNaN(a) || isNaN(t)) {
        alert("Please enter values for acceleration and time.");
        return;
    }
    if (t < 0) {
        alert("Time cannot be negative.");
        return;
    }
    
    const v = u + (a * t);
    const out = document.getElementById('v_res');
    out.innerText = "Final Velocity (v) = " + v.toFixed(2) + " m/s";
    out.style.display = "block";

    saveToHistory(u, a, t, v.toFixed(2));
}

function saveToHistory(u, a, t, v) {
    let history = [];
    try {
        history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
        console.warn("Storage access restricted", e);
    }

    history.unshift({ u, a, t, v });
    if (history.length > 8) history.pop();

    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch(e) {
        console.warn("Could not save to localStorage", e);
    }

    renderHistory(history);
}

function loadHistory() {
    let history = [];
    try {
        history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
        console.warn("Storage access restricted", e);
    }
    renderHistory(history);
}

function renderHistory(history) {
    const list = document.getElementById('historyList');
    list.innerHTML = "";
    
    if (history.length === 0) {
        list.innerHTML = "<div style='color: #94a3b8; font-size: 11px;'>No recent calculations.</div>";
        return;
    }

    history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.onclick = () => {
            document.getElementById('v_u').value = item.u;
            document.getElementById('v_a').value = item.a;
            document.getElementById('v_t').value = item.t;
            document.getElementById('v_res').innerText = "Final Velocity (v) = " + item.v + " m/s";
            document.getElementById('v_res').style.display = "block";
        };
        div.innerHTML = `
            <div class="history-calc">Final Velocity (v) = ${item.v} m/s</div>
            <div class="history-meta">u: ${item.u} m/s | a: ${item.a} m/s² | t: ${item.t} s</div>
        `;
        list.appendChild(div);
    });
}

function clearHistory() {
    try {
        localStorage.removeItem(STORAGE_KEY);
    } catch(e) {}
    renderHistory([]);
}
</script>

</body>
</html>
