<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Time (t)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: transparent;
            margin: 0;
            padding: 10px;
        }
        .physics-calc-box {
            max-width: 360px;
            margin: 0 auto;
            padding: 20px;
            background: #fdfdfd;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .physics-calc-box h3 { margin: 0 0 5px 0; color: #1e293b; }
        .calc-formula { margin: 0 0 15px 0; font-size: 13px; color: #64748b; font-style: italic; }
        .calc-field { margin-bottom: 12px; }
        .calc-field label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 500; color: #475569; }
        .calc-field input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .calc-field input:focus { outline: 2px solid #7c3aed; border-color: transparent; }
        .calc-button { width: 100%; background: #7c3aed; color: white; border: none; padding: 10px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 5px; transition: background 0.2s; }
        .calc-button:hover { background: #6d28d9; }
        .calc-output { margin-top: 15px; padding: 12px; background: #f0fdf4; border-left: 4px solid #16a34a; border-radius: 4px; color: #166534; font-weight: 600; font-size: 16px; }

        /* Widget-Specific History Panel */
        .history-section { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 14px; }
        .history-title { font-size: 13px; font-weight: 700; color: #334155; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .clear-btn { background: none; border: none; color: #ef4444; font-size: 11px; cursor: pointer; font-weight: 600; padding: 0; }
        .history-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item { background: #f8fafc; border: 1px solid #f1f5f9; padding: 8px 10px; border-radius: 6px; font-size: 12px; color: #334155; cursor: pointer; }
        .history-item:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .history-calc { font-weight: 600; color: #1e293b; }
        .history-meta { color: #64748b; font-size: 11px; margin-top: 2px; }
    </style>
</head>
<body>

<div class="physics-calc-box">
    <h3>Calculate Time (t)</h3>
    <p class="calc-formula">Formula: t = (v - u) / a</p>
    
    <div class="calc-field">
        <label for="t_u">Initial Velocity (u) in m/s:</label>
        <input type="number" id="t_u" value="0" step="any">
    </div>
    <div class="calc-field">
        <label for="t_v">Final Velocity (v) in m/s:</label>
        <input type="number" id="t_v" placeholder="e.g. 30" step="any">
    </div>
    <div class="calc-field">
        <label for="t_a">Acceleration (a) in m/s²:</label>
        <input type="number" id="t_a" placeholder="e.g. 2" step="any">
    </div>
    
    <button onclick="calcTime()" class="calc-button">Calculate Time</button>
    
    <div id="t_res" class="calc-output" style="display: none;"></div>

    <div class="history-section">
        <div class="history-title">
            <span>Recent Calculations</span>
            <button onclick="clearHistory()" class="clear-btn">Clear</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<script>
// Isolated key specifically for this single calculator
const STORAGE_KEY = 'physics_time_calculator_history';

document.addEventListener('DOMContentLoaded', loadHistory);

function calcTime() {
    const uInput = document.getElementById('t_u').value;
    const vInput = document.getElementById('t_v').value;
    const aInput = document.getElementById('t_a').value;

    const u = parseFloat(uInput) || 0;
    const v = parseFloat(vInput);
    const a = parseFloat(aInput);
    
    if (isNaN(v) || isNaN(a)) {
        alert("Please enter values for final velocity and acceleration.");
        return;
    }
    if (a === 0) {
        alert("Acceleration cannot be 0 (cannot divide by zero).");
        return;
    }
    
    const t = (v - u) / a;
    const out = document.getElementById('t_res');
    let resultText = "";
    
    if (t < 0) {
        resultText = "Time (t) = " + t.toFixed(2) + " s (Note: Output is negative)";
    } else {
        resultText = "Time (t) = " + t.toFixed(2) + " seconds";
    }

    out.innerText = resultText;
    out.style.display = "block";

    saveToHistory(u, v, a, t.toFixed(2));
}

function saveToHistory(u, v, a, t) {
    let history = [];
    try {
        history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
        console.warn("Storage access restricted", e);
    }

    history.unshift({ u, v, a, t });
    if (history.length > 8) history.pop();

    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch(e) {
        console.warn("Could not save to localStorage", e);
    }

    renderHistory(history);
}

function loadHistory() {
    let history = [];
    try {
        history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
        console.warn("Storage access restricted", e);
    }
    renderHistory(history);
}

function renderHistory(history) {
    const list = document.getElementById('historyList');
    list.innerHTML = "";
    
    if (history.length === 0) {
        list.innerHTML = "<div style='color: #94a3b8; font-size: 11px;'>No recent calculations.</div>";
        return;
    }

    history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.onclick = () => {
            document.getElementById('t_u').value = item.u;
            document.getElementById('t_v').value = item.v;
            document.getElementById('t_a').value = item.a;
            document.getElementById('t_res').innerText = "Time (t) = " + item.t + " seconds";
            document.getElementById('t_res').style.display = "block";
        };
        div.innerHTML = `
            <div class="history-calc">Time (t) = ${item.t} s</div>
            <div class="history-meta">u: ${item.u} m/s | v: ${item.v} m/s | a: ${item.a} m/s²</div>
        `;
        list.appendChild(div);
    });
}

function clearHistory() {
    try {
        localStorage.removeItem(STORAGE_KEY);
    } catch(e) {}
    renderHistory([]);
}
</script>

</body>
</html>
